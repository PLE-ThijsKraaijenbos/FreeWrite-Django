[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"

[deploy]
startCommand = '/bin/sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"'
healthcheckPath = "/api/health/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3